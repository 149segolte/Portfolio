<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
    <defs>
        <filter id="rainbow-filter">
            <feGaussianBlur stdDeviation="8" />
            <feOffset dx="2" dy="2" />
            <feBlend in="SourceGraphic" />
        </filter>

        <radialGradient id="glow1">
            <stop offset="0%" stop-color="#3700FF" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>

        <radialGradient id="glow2">
            <stop offset="0%" stop-color="#FBA40E" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>

        <radialGradient id="glow3">
            <stop offset="0%" stop-color="#9A046B" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>

        <radialGradient id="glow4">
            <stop offset="0%" stop-color="#0FA37E" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
    </defs>

    <circle
        cx="-25"
        cy="40"
        r="75"
        fill="url(#glow1)"
        filter="url(#rainbow-filter)"
    >
        <animateMotion
            dur="4s"
            repeatCount="indefinite"
            path="M55 15a7 15 0 101 0H55"/>
